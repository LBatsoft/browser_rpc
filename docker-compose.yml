version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 网关 (Gateway) - 统一入口
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=dev-test-key
      - CLUSTER_SECRET=dev-cluster-secret
    depends_on:
      - redis
    command: python gateway.py

  # 浏览器节点 (Worker)
  browser-node-1:
    build: .
    environment:
      - HTTP_PORT=8001
      - MAX_SESSIONS=5
      - REDIS_URL=redis://redis:6379/0
      - CLUSTER_SECRET=dev-cluster-secret
      - NODE_HOST=browser-node-1  # 使用容器名，Gateway 可以通过此名称访问
    volumes:
      - ./log:/app/log
    depends_on:
      - redis
    command: python http_server.py

  # 浏览器节点 2 (Worker) - 模拟扩展
  browser-node-2:
    build: .
    environment:
      - HTTP_PORT=8002
      - MAX_SESSIONS=5
      - REDIS_URL=redis://redis:6379/0
      - CLUSTER_SECRET=dev-cluster-secret
      - NODE_HOST=browser-node-2  # 使用容器名，Gateway 可以通过此名称访问
    volumes:
      - ./log:/app/log
    depends_on:
      - redis
    command: python http_server.py

  # Prometheus - 监控数据收集
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - gateway
      - browser-node-1
      - browser-node-2

  # Grafana - 监控可视化
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge