apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: browser-rpc
  labels:
    app: worker
spec:
  replicas: 3  # 可以根据负载调整
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: browser-rpc:latest  # 需要构建并推送到镜像仓库
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HTTP_PORT
          value: "8000"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: browser-rpc-config
              key: REDIS_URL
        - name: CLUSTER_SECRET
          valueFrom:
            secretKeyRef:
              name: browser-rpc-secrets
              key: CLUSTER_SECRET
        - name: MAX_SESSIONS
          valueFrom:
            configMapKeyRef:
              name: browser-rpc-config
              key: MAX_SESSIONS
        - name: NODE_HOST
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: log-volume
          mountPath: /app/log
      volumes:
      - name: log-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: browser-rpc
  labels:
    app: worker
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: worker

