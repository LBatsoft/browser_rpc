apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: browser-rpc
  labels:
    app: gateway
spec:
  replicas: 2  # 可以水平扩展
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: browser-rpc:latest  # 需要构建并推送到镜像仓库
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: browser-rpc-config
              key: REDIS_URL
        - name: CLUSTER_SECRET
          valueFrom:
            secretKeyRef:
              name: browser-rpc-secrets
              key: CLUSTER_SECRET
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: browser-rpc-secrets
              key: API_KEY
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: browser-rpc
  labels:
    app: gateway
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: gateway

