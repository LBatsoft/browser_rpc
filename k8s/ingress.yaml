apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: browser-rpc
  annotations:
    # 根据你的 Ingress Controller 调整
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # 根据你的 Ingress Controller 调整
  rules:
  - host: browser-rpc.example.com  # 修改为你的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8000
  # 如果需要 TLS
  # tls:
  # - hosts:
  #   - browser-rpc.example.com
  #   secretName: browser-rpc-tls

