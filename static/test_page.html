<!DOCTYPE html>
<html>
<head>
    <title>Click Test Page</title>
    <style>
        body { font-family: Arial; padding: 50px; }
        #target { 
            width: 200px; 
            height: 200px; 
            background: #4CAF50; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px;
            cursor: pointer;
            margin: 20px;
        }
        #target:hover { background: #45a049; }
        #target:active { background: #3d8b40; }
        input { 
            padding: 10px; 
            font-size: 16px; 
            margin: 20px;
            width: 300px;
        }
        #log {
            margin: 20px;
            padding: 10px;
            background: #f0f0f0;
            min-height: 200px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>点击测试页面</h1>
    
    <div id="target" onclick="logEvent('DIV clicked!')">
        点我！
    </div>
    
    <input type="text" id="testInput" placeholder="测试输入框" onfocus="logEvent('Input focused')" oninput="logEvent('Input: ' + this.value)">
    
    <div id="log">事件日志：\n</div>
    
    <script>
        function logEvent(msg) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            log.textContent += `[${time}] ${msg}\n`;
        }
        
        document.addEventListener('mousedown', (e) => {
            logEvent(`mousedown at (${e.clientX}, ${e.clientY})`);
        });
        
        document.addEventListener('mouseup', (e) => {
            logEvent(`mouseup at (${e.clientX}, ${e.clientY})`);
        });
        
        document.addEventListener('click', (e) => {
            logEvent(`click at (${e.clientX}, ${e.clientY}) on ${e.target.tagName}`);
        });
    </script>
</body>
</html>
